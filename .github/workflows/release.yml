name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Refuse a version already released
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if git rev-parse --verify --quiet "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged: bump every package before releasing." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run db:generate

      - run: pnpm run build:core

      - run: pnpm run lint:conventions

      - name: Publish every package through npm trusted publishing
        run: pnpm -r publish --access public --no-git-checks

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes
