name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://heryjs:heryjs@localhost:5432/heryjs
      BETTER_AUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: heryjs
          POSTGRES_PASSWORD: heryjs
          POSTGRES_DB: heryjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma migrate deploy

      - run: pnpm run lint

      - run: pnpm run arch:check

      - run: pnpm run lint:capabilities

      - run: pnpm run lint:scope-parity

      - run: pnpm run lint:coverage

      - run: pnpm run lint:dev-guard

      - run: pnpm run lint:subject

      - run: pnpm test

      - run: pnpm run build
