name: CI

# Every branch, not just main. The workflow used to trigger on main alone, so a
# feature branch ran no checks at all until a pull request existed -- and three
# defects that only a runner can see (a refused install, a missing service, an
# unhandled rejection) sat undetected for a month behind a green local gate.
# pull_request is deliberately absent: a push run is attached to the same commit
# a pull request points at, so its checks already show up there, and adding the
# event would only run everything twice.
on:
  push:
  workflow_dispatch:

# Neither job writes to the repository, comments on a pull request or touches
# Pages, so neither needs a token that could. docs.yml already scopes its own;
# this one inherited whatever the repository default happened to be, which is
# the permission nobody chose.
permissions:
  contents: read

# A branch under active pushing keeps only its latest run. main keeps every one,
# because each of its runs is the record for a commit that shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://heryjs:heryjs@localhost:5432/heryjs
      REDIS_URL: redis://localhost:6479
      BETTER_AUTH_URL: http://localhost:3000

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: heryjs
          POSTGRES_PASSWORD: heryjs
          POSTGRES_DB: heryjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Half the suites boot the whole application, and the queue module opens
      # a connection as soon as they do -- without this they failed on a
      # refused connection to 6479, which is the port the compose stack uses
      # and the default REDIS_URL points at.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6479:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # The backup spec shells out to pg_dump and pg_restore against the
      # postgres service above. The runner image ships version 16 clients, and
      # pg_dump refuses a server newer than itself, so the 17 clients come from
      # the PostgreSQL apt repository and are put first on the PATH.
      - name: Install the PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run db:generate

      - run: pnpm exec prisma migrate deploy

      - run: pnpm run lint

      - run: pnpm run lint:fast

      - run: pnpm run lint:types

      - run: pnpm run typecheck

      - run: pnpm run typecheck:packages

      - run: pnpm run arch:check

      - run: pnpm run lint:conventions

      - run: pnpm run lint:hery

      - run: pnpm test

      - run: pnpm run test:e2e

      - run: pnpm run build

      # The eleven modules, which nothing else here compiles: a typecheck reads
      # them through a path to the contract source, while their build resolves
      # it through the package the way a third party's does. Those are two
      # different resolutions, and only this step exercises the published one --
      # a broken module build reached main once already behind a green run.
      - run: pnpm run build:modules

      # Both Astro workspaces, on every run rather than only when their own
      # files change: what broke the docs build during the last dependency
      # bump was the root lockfile, not anything under docs/.
      - run: pnpm --filter admin run build

      - run: pnpm --filter docs run build

  # The getting-started path, run the way the README gives it. Everything above
  # proves this repository; a generated project renames the root package and
  # strips the demo, and twice that broke its first install or its first
  # migrate behind a green build-and-test.
  scaffold:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://heryjs:heryjs@localhost:5432/heryjs
      REDIS_URL: redis://localhost:6479
      BETTER_AUTH_URL: http://localhost:3000

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: heryjs
          POSTGRES_PASSWORD: heryjs
          POSTGRES_DB: heryjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Scaffold a project
        run: |
          mkdir -p "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          NODE_OPTIONS=--conditions=development \
            "$GITHUB_WORKSPACE/node_modules/.bin/ts-node" \
            -P "$GITHUB_WORKSPACE/tsconfig.json" \
            "$GITHUB_WORKSPACE/cli/heryjs.ts" new my-app

      - name: Install, migrate, typecheck and build it
        working-directory: ${{ runner.temp }}/scaffold/my-app
        run: |
          cp .env.example .env
          pnpm install
          pnpm hery migrate --name init
          pnpm run typecheck
          pnpm run build

  # The specs that boot a module for real: the two search drivers against
  # live engines, and the GraphQL module against a live HTTP server. They
  # live here rather than in build-and-test because they need services that
  # the application suite has no use for.
  module-integration:
    runs-on: ubuntu-latest

    env:
      # Only "prisma generate" reads this one -- nothing in this job connects
      # to a database, so no postgres service is started for it.
      DATABASE_URL: postgresql://heryjs:heryjs@localhost:5432/heryjs
      ELASTICSEARCH_URL: http://localhost:9200
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_API_KEY: heryjs-dev-master-key
      STORAGE_S3_ENDPOINT: http://localhost:9000
      STORAGE_S3_ACCESS_KEY: heryjs
      STORAGE_S3_SECRET_KEY: heryjs-dev-secret

    # Kept in step with the images each module ships in its own
    # docker-compose.search-*.yml: a driver tested against another version is
    # a driver tested against another server.
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
          - 9200:9200

      meilisearch:
        image: getmeili/meilisearch:v1.24
        env:
          MEILI_MASTER_KEY: heryjs-dev-master-key
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run db:generate

      # Neither image ships a health command this runner can rely on, so the
      # wait happens here rather than in the service definition.
      - name: Wait for the search engines
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:9200 >/dev/null 2>&1 &&
               curl -fsS http://localhost:7700/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'elasticsearch or meilisearch never became reachable'
          exit 1

      # Started here rather than as a service: a service cannot be given a
      # command, and the image has to be the one docker-compose.storage.yml
      # runs, for the same reason as above. The spec creates its own bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=heryjs \
            -e MINIO_ROOT_PASSWORD=heryjs-dev-secret \
            bitnamilegacy/minio:2025.5.24-debian-12-r5
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'minio never became reachable'
          docker logs minio
          exit 1

      - run: pnpm run test:modules
