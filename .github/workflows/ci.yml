name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://heryjs:heryjs@localhost:5432/heryjs
      REDIS_URL: redis://localhost:6479
      BETTER_AUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: heryjs
          POSTGRES_PASSWORD: heryjs
          POSTGRES_DB: heryjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Half the suites boot the whole application, and the queue module opens
      # a connection as soon as it does -- without this they failed on a
      # refused connection to 6479, which is the port the compose stack uses
      # and the default REDIS_URL points at.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6479:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma migrate deploy

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run typecheck:packages

      - run: pnpm run arch:check

      - run: pnpm run lint:conventions

      - run: pnpm run lint:hery

      - run: pnpm test

      - run: pnpm run build
