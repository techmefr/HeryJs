name: CI

# Every branch, not just main. The workflow used to trigger on main alone, so a
# feature branch ran no checks at all until a pull request existed -- and three
# defects that only a runner can see (a refused install, a missing service, an
# unhandled rejection) sat undetected for a month behind a green local gate.
# pull_request is deliberately absent: a push run is attached to the same commit
# a pull request points at, so its checks already show up there, and adding the
# event would only run everything twice.
on:
  push:
  workflow_dispatch:

# Neither job writes to the repository, comments on a pull request or touches
# Pages, so neither needs a token that could. docs.yml already scopes its own;
# this one inherited whatever the repository default happened to be, which is
# the permission nobody chose.
permissions:
  contents: read

# A branch under active pushing keeps only its latest run. main keeps every one,
# because each of its runs is the record for a commit that shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://heryjs_app:heryjs_app@localhost:5432/heryjs
      DATABASE_MIGRATION_URL: postgresql://heryjs:heryjs@localhost:5432/heryjs
      REDIS_URL: redis://localhost:6479
      BETTER_AUTH_URL: http://localhost:3000

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: heryjs
          POSTGRES_PASSWORD: heryjs
          POSTGRES_DB: heryjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Half the suites boot the whole application, and the queue module opens
      # a connection as soon as they do -- without this they failed on a
      # refused connection to 6479, which is the port the compose stack uses
      # and the default REDIS_URL points at.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6479:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # The backup spec shells out to pg_dump and pg_restore against the
      # postgres service above. The runner image ships version 16 clients, and
      # pg_dump refuses a server newer than itself, so the 17 clients come from
      # the PostgreSQL apt repository and are put first on the PATH.
      - name: Install the PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run db:generate

      # The app connects as heryjs_app, which the compose stack creates on
      # first boot and a service container cannot: no superuser, no BYPASSRLS.
      - name: Create the application database role
        run: psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f scripts/postgres/app-role.sql

      - run: pnpm exec prisma migrate deploy

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm run lint:fast

      - run: pnpm run lint:types

      - run: pnpm run typecheck

      - run: pnpm run typecheck:packages

      - run: pnpm run arch:check

      - run: pnpm run lint:conventions

      - run: pnpm run lint:hery

      # One step per suite, each run even when an earlier one failed, so a red
      # application suite does not hide the state of the others.
      - run: pnpm run test:app

      - if: ${{ !cancelled() }}
        run: pnpm run test:module-specs

      - if: ${{ !cancelled() }}
        run: pnpm --filter admin test

      - name: Check the generated endpoint examples are fresh
        if: ${{ !cancelled() }}
        run: |
          pnpm run docs:examples
          git diff --exit-code docs/src/data/endpoint-examples.generated.ts

      - if: ${{ !cancelled() }}
        run: pnpm run test:e2e

      - run: pnpm run build

      # The eleven modules, which nothing else here compiles: a typecheck reads
      # them through a path to the contract source, while their build resolves
      # it through the package the way a third party's does. Those are two
      # different resolutions, and only this step exercises the published one --
      # a broken module build reached main once already behind a green run.
      - run: pnpm run build:modules

      # Both Astro workspaces, on every run rather than only when their own
      # files change: what broke the docs build during the last dependency
      # bump was the root lockfile, not anything under docs/.
      - run: pnpm --filter admin run build

      - run: pnpm --filter docs run build

  # The application suite in a random order, with a fresh seed each run and the
  # seed printed: a spec that only passes after another one has left data
  # behind fails here, and the printed seed replays it with --seed.
  randomized-order:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://heryjs_app:heryjs_app@localhost:5432/heryjs
      DATABASE_MIGRATION_URL: postgresql://heryjs:heryjs@localhost:5432/heryjs
      REDIS_URL: redis://localhost:6479
      BETTER_AUTH_URL: http://localhost:3000

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: heryjs
          POSTGRES_PASSWORD: heryjs
          POSTGRES_DB: heryjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6479:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install the PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run db:generate

      # The app connects as heryjs_app, which the compose stack creates on
      # first boot and a service container cannot: no superuser, no BYPASSRLS.
      - name: Create the application database role
        run: psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f scripts/postgres/app-role.sql

      - run: pnpm exec prisma migrate deploy

      - run: pnpm run test:random

  # The getting-started path, run the way the README gives it. Everything above
  # proves this repository; a generated project renames the root package and
  # strips the demo, and twice that broke its first install or its first
  # migrate behind a green build-and-test.
  scaffold:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://heryjs_app:heryjs_app@localhost:5432/heryjs
      DATABASE_MIGRATION_URL: postgresql://heryjs:heryjs@localhost:5432/heryjs
      REDIS_URL: redis://localhost:6479
      BETTER_AUTH_URL: http://localhost:3000

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: heryjs
          POSTGRES_PASSWORD: heryjs
          POSTGRES_DB: heryjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The production boot below opens its queues and its cache on it.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6479:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create the application database role
        run: psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f scripts/postgres/app-role.sql

      # The project installs the kernel from this build, as it would install
      # the published tarball: dist and the manifest, never the symlinks
      # packages/core/src holds into this repository.
      - name: Build the kernel and check what its tarball carries
        run: |
          pnpm run db:generate
          pnpm run build:core
          cd packages/core
          npm pack --dry-run --json | node -e '
            const [pack] = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const paths = pack.files.map((file) => file.path);
            const outside = paths.filter((p) => p !== "package.json" && !p.startsWith("dist/"));
            if (outside.length > 0 || !paths.includes("dist/technical/public/auth.js")) {
              console.error("unexpected tarball:", outside, paths.length);
              process.exit(1);
            }
          '

      - name: Scaffold a project
        run: |
          mkdir -p "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          NODE_OPTIONS="--conditions=development --conditions=heryjs-source" \
            "$GITHUB_WORKSPACE/node_modules/.bin/ts-node" \
            -P "$GITHUB_WORKSPACE/tsconfig.json" \
            "$GITHUB_WORKSPACE/cli/heryjs.ts" new my-app

      # The kernel is a dependency, not a copy, and the project resolves it to
      # dist even with the development condition on.
      - name: Install, migrate, typecheck and build it
        working-directory: ${{ runner.temp }}/scaffold/my-app
        run: |
          test "$(ls src/modules | tr '\n' ' ')" = 'impersonation push two-factor '
          test ! -e src/technical
          test ! -e packages/core
          test "$(ls src/devtools | tr '\n' ' ')" = 'test-support.ts testing '
          test -f src/devtools/testing/register-and-login.ts
          grep -q '"@heryjs/core": "file:' package.json
          cp .env.example .env
          pnpm install
          node --conditions=development -p "require.resolve('@heryjs/core/tenancy')" |
            grep -q '/dist/technical/public/tenancy.js$'
          pnpm hery migrate --name init
          pnpm run typecheck
          pnpm run build

      # The conventions ship in @heryjs/core and run against the project's own
      # code; none of the framework's check scripts is copied in.
      - name: Hold it to the conventions
        working-directory: ${{ runner.temp }}/scaffold/my-app
        run: |
          test ! -e scripts/check-conventions.ts
          test "$(ls scripts | tr '\n' ' ')" = 'postgres '
          ! grep -q 'lint:conventions' package.json .github/workflows/ci.yml
          pnpm hery check

      # What production runs is the build, with production's environment: a
      # dependency that resolves only while developing, or a variable the
      # production schema refuses, fails here rather than on a deploy.
      - name: Boot the build in production
        working-directory: ${{ runner.temp }}/scaffold/my-app
        env:
          NODE_ENV: production
          PORT: '3917'
          CORS_ORIGINS: https://app.example.com
        run: |
          secret() { openssl rand -base64 32; }
          export BETTER_AUTH_SECRET="$(secret)" SIGNAL_TOKEN_SECRET="$(secret)" \
            SSE_TOKEN_SECRET="$(secret)" OAUTH_STATE_SECRET="$(secret)" \
            STORAGE_URL_SECRET="$(secret)" SECRETS_KEYS="1:$(secret)"
          node dist/src/main > boot.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3917/health/live; then
              kill "$pid"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          tail -n 60 boot.log
          exit 1

      # view: all is the preset the generated bin spec used to get wrong: the
      # stranger can open the record there, so it is in their bin too.
      - name: Generate a resource everyone can view and run its specs
        working-directory: ${{ runner.temp }}/scaffold/my-app
        run: |
          pnpm hery create:blueprint Note -y
          sed -i 's/view: own/view: all/' blueprints/note.yaml
          pnpm hery generate Note
          sed -i "1i import { NoteModule } from '#functional/note/note.module';" src/app.module.ts
          sed -i 's/^  imports: \[$/  imports: [\n    NoteModule,/' src/app.module.ts
          pnpm hery migrate --name note
          pnpm run typecheck
          NODE_OPTIONS=--experimental-vm-modules pnpm exec jest src/functional/note

      # Left out of the scaffold, a module has to come back whole.
      - name: Install a module on demand
        working-directory: ${{ runner.temp }}/scaffold/my-app
        run: |
          pnpm hery install scim sso storage
          pnpm exec prisma generate
          pnpm run typecheck
          pnpm run build
          test ! -e src/technical
          pnpm hery migrate --name modules
          pnpm hery check

      # A project generated before the kernel became a dependency: the last
      # commit whose "hery new" still copied src/technical writes it, and
      # "hery kernel:migrate" from this commit moves it onto the package. It
      # gets a database of its own, created from template1 with the app role's
      # grants, so its migrations do not meet the project above.
      - name: Generate a project that still copies the kernel
        env:
          LAST_COPYING_COMMIT: 1c55ed42d81c91bb84feb9e619254f3a6cc0628a
        run: |
          git fetch --depth=1 origin "$LAST_COPYING_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/old-heryjs" "$LAST_COPYING_COMMIT"
          cd "$RUNNER_TEMP/old-heryjs"
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/old"
          cd "$RUNNER_TEMP/old"
          NODE_OPTIONS=--conditions=development \
            "$RUNNER_TEMP/old-heryjs/node_modules/.bin/ts-node" \
            -P "$RUNNER_TEMP/old-heryjs/tsconfig.json" \
            "$RUNNER_TEMP/old-heryjs/cli/heryjs.ts" new old-app
          cd old-app
          test -d src/technical
          printf "export const projectOwned = 'kept';\n" > src/functional/project-owned.ts
          cp .env.example .env
          pnpm install

      - name: Refuse to migrate a kernel the project modified
        working-directory: ${{ runner.temp }}/old
        run: |
          cp -r old-app tampered
          cd tampered
          echo '// a local change' >> src/technical/config/env.ts
          if NODE_OPTIONS="--conditions=development --conditions=heryjs-source" \
            "$GITHUB_WORKSPACE/node_modules/.bin/ts-node" \
            -P "$GITHUB_WORKSPACE/tsconfig.json" \
            "$GITHUB_WORKSPACE/cli/hery.ts" kernel:migrate 2> refusal.log; then
            echo 'kernel:migrate accepted a modified kernel'
            exit 1
          fi
          cat refusal.log
          grep -q 'src/technical/config/env.ts' refusal.log
          test -d src/technical
          test -d packages/core
          diff -rq --exclude=node_modules --exclude=.git ../old-app . > ../refused.diff || true
          cat ../refused.diff
          test "$(grep -vc -e 'src/technical/config/env.ts differ$' -e 'Only in .: refusal.log$' ../refused.diff)" = 0

      - name: Migrate it onto the package, then install, migrate, typecheck and build it
        working-directory: ${{ runner.temp }}/old/old-app
        env:
          DATABASE_URL: postgresql://heryjs_app:heryjs_app@localhost:5432/heryjs_old
          DATABASE_MIGRATION_URL: postgresql://heryjs:heryjs@localhost:5432/heryjs_old
        run: |
          NODE_OPTIONS="--conditions=development --conditions=heryjs-source" \
            "$GITHUB_WORKSPACE/node_modules/.bin/ts-node" \
            -P "$GITHUB_WORKSPACE/tsconfig.json" \
            "$GITHUB_WORKSPACE/cli/hery.ts" kernel:migrate
          test ! -e src/technical
          test ! -e packages/core
          test "$(ls src/devtools | tr '\n' ' ')" = 'test-support.ts testing '
          test "$(cat src/functional/project-owned.ts)" = "export const projectOwned = 'kept';"
          grep -q '"@heryjs/core": "file:' package.json
          test ! -e scripts/check-conventions.ts
          test "$(ls scripts | tr '\n' ' ')" = 'postgres '
          grep -q '"check": "pnpm hery check"' package.json
          psql postgresql://heryjs:heryjs@localhost:5432/heryjs -v ON_ERROR_STOP=1 -c 'CREATE DATABASE heryjs_old'
          pnpm install --no-frozen-lockfile
          pnpm hery migrate --name init
          pnpm run typecheck
          pnpm run build

      - name: Boot the migrated build in production
        working-directory: ${{ runner.temp }}/old/old-app
        env:
          DATABASE_URL: postgresql://heryjs_app:heryjs_app@localhost:5432/heryjs_old
          NODE_ENV: production
          PORT: '3918'
          CORS_ORIGINS: https://app.example.com
        run: |
          secret() { openssl rand -base64 32; }
          export BETTER_AUTH_SECRET="$(secret)" SIGNAL_TOKEN_SECRET="$(secret)" \
            SSE_TOKEN_SECRET="$(secret)" OAUTH_STATE_SECRET="$(secret)" \
            STORAGE_URL_SECRET="$(secret)" SECRETS_KEYS="1:$(secret)"
          node dist/src/main > boot.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3918/health/live; then
              kill "$pid"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          tail -n 60 boot.log
          exit 1

  # The specs that boot a module for real: the two search drivers against
  # live engines, and the GraphQL module against a live HTTP server. They
  # live here rather than in build-and-test because they need services that
  # the application suite has no use for.
  module-integration:
    runs-on: ubuntu-latest

    env:
      # Only "prisma generate" reads this one -- nothing in this job connects
      # to a database, so no postgres service is started for it.
      DATABASE_URL: postgresql://heryjs:heryjs@localhost:5432/heryjs
      ELASTICSEARCH_URL: http://localhost:9200
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_API_KEY: heryjs-dev-master-key
      STORAGE_S3_ENDPOINT: http://localhost:9000
      STORAGE_S3_ACCESS_KEY: heryjs
      STORAGE_S3_SECRET_KEY: heryjs-dev-secret

    # Kept in step with the images each module ships in its own
    # docker-compose.search-*.yml: a driver tested against another version is
    # a driver tested against another server.
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
          - 9200:9200

      meilisearch:
        image: getmeili/meilisearch:v1.24
        env:
          MEILI_MASTER_KEY: heryjs-dev-master-key
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run db:generate

      # Neither image ships a health command this runner can rely on, so the
      # wait happens here rather than in the service definition.
      - name: Wait for the search engines
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:9200 >/dev/null 2>&1 &&
               curl -fsS http://localhost:7700/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'elasticsearch or meilisearch never became reachable'
          exit 1

      # Started here rather than as a service: a service cannot be given a
      # command, and the image has to be the one docker-compose.storage.yml
      # runs, for the same reason as above. The spec creates its own bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=heryjs \
            -e MINIO_ROOT_PASSWORD=heryjs-dev-secret \
            bitnamilegacy/minio:2025.5.24-debian-12-r5
          # The image answers once, then restarts after its first-boot setup:
          # ready means ten consecutive answers, not the first one.
          streak=0
          for _ in $(seq 1 120); do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1; then
              streak=$((streak + 1))
              if [ "$streak" -ge 10 ]; then
                exit 0
              fi
            else
              streak=0
            fi
            sleep 1
          done
          echo 'minio never stayed ready'
          docker logs minio
          exit 1

      - run: pnpm run test:modules
