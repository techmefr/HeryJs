services:
  minio:
    # The Bitnami build of MinIO, pinned: MinIO stopped publishing its own
    # images, so minio/minio:latest no longer pulls. It reads the same two
    # variables and serves the S3 API on 9000 and the console on 9001.
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: heryjs
      MINIO_ROOT_PASSWORD: heryjs-dev-secret
    ports:
      - '9000'
      - '9001'
    volumes:
      - heryjs-minio:/bitnami/minio/data

volumes:
  heryjs-minio:
