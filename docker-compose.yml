services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heryjs
      POSTGRES_PASSWORD: heryjs
      POSTGRES_DB: heryjs
    ports:
      - '5432'
    volumes:
      - heryjs-postgres:/var/lib/postgresql/data
    # A dev process that dies without closing its connection (a killed test
    # run, an orphaned background job) otherwise leaves a transaction open
    # indefinitely -- it happened, and it starved every other connection's
    # transactions until someone noticed and killed it by hand. Postgres now
    # kills that connection itself once it sits idle mid-transaction, or once
    # a single statement runs too long, instead of relying on that.
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=30000
      - -c
      - statement_timeout=60000

  valkey:
    image: valkey/valkey:8-alpine
    # Bounded on purpose. Every CacheService key carries a TTL, so growth is
    # normally write-rate times TTL -- but nothing enforced a ceiling, and the
    # default policy is noeviction: at the memory limit Valkey starts refusing
    # writes rather than shedding keys, which turns a full cache into failing
    # requests. allkeys-lru degrades instead, and the cache is the one store
    # here whose contents are all reconstructible.
    command: >-
      valkey-server --maxmemory ${HERYJS_VALKEY_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    restart: unless-stopped
    ports:
      - '6379'
    volumes:
      - heryjs-valkey:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HERYJS_DOMAIN: ${HERYJS_DOMAIN:-heryjs.local}
      HERYJS_APP_PORT: ${HERYJS_APP_PORT:-3000}
    ports:
      - '${HERYJS_HTTP_PORT:-80}:80'
      - '${HERYJS_HTTPS_PORT:-443}:443'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - heryjs-caddy-data:/data

volumes:
  heryjs-postgres:
  heryjs-valkey:
  heryjs-caddy-data:
