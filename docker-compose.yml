services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: heryjs
      POSTGRES_PASSWORD: heryjs
      POSTGRES_DB: heryjs
    ports:
      - '5432'
    # POSTGRES_USER owns the schema and runs the migrations
    # (DATABASE_MIGRATION_URL). The app connects as heryjs_app (DATABASE_URL),
    # created on the first boot of an empty volume by the script mounted below:
    # no superuser, no BYPASSRLS, so row-level security applies to it.
    volumes:
      - heryjs-postgres:/var/lib/postgresql/data
      - ./scripts/postgres/app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    # A dev process that dies without closing its connection (a killed test
    # run, an orphaned background job) otherwise leaves a transaction open
    # indefinitely -- it happened, and it starved every other connection's
    # transactions until someone noticed and killed it by hand. Postgres now
    # kills that connection itself once it sits idle mid-transaction, or once
    # a single statement runs too long, instead of relying on that.
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=30000
      - -c
      - statement_timeout=60000

  valkey:
    image: valkey/valkey:8-alpine
    # Bounded on purpose, and never evicting. The cache is not the only thing
    # stored here: BullMQ keeps every queued job, its locks and the outbox
    # relay in the same server, and an eviction policy drops those as readily
    # as a cache entry -- a job that silently disappears. noeviction refuses
    # writes at the limit instead, which fails loudly; "pnpm hery doctor"
    # checks the policy of whatever Valkey REDIS_URL points at.
    command: >-
      valkey-server --maxmemory ${HERYJS_VALKEY_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
    restart: unless-stopped
    ports:
      - '6379'
    volumes:
      - heryjs-valkey:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HERYJS_DOMAIN: ${HERYJS_DOMAIN:-heryjs.local}
      HERYJS_APP_PORT: ${HERYJS_APP_PORT:-3000}
    ports:
      - '${HERYJS_HTTP_PORT:-80}:80'
      - '${HERYJS_HTTPS_PORT:-443}:443'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - heryjs-caddy-data:/data

volumes:
  heryjs-postgres:
  heryjs-valkey:
  heryjs-caddy-data:
