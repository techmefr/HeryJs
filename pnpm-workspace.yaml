packages:
  - '.'
  - 'admin'
  - 'docs'
  - 'packages/*'

allowBuilds:
  '@apollo/protobufjs': true
  # jest-haste-map pulls it in for watch mode only, and jest falls back to
  # its own crawler without it -- so the native build is refused rather
  # than approved, and a fresh install stops asking.
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 1440

overrides:
  '@types/node': ^24.13.3
  "@graphql-tools/utils@>=10.10.1 <12.0.2": ^12.0.2
  "effect@<3.22.1": ^3.22.1
  "uuid@<11.1.1": ^11.1.1
  "glob@>=9.0.0 <14.0.2": ^14.0.2
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
