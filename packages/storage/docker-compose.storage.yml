services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: heryjs
      MINIO_ROOT_PASSWORD: heryjs-dev-secret
    ports:
      - '9000'
      - '9001'
    volumes:
      - heryjs-minio:/data

volumes:
  heryjs-minio:
