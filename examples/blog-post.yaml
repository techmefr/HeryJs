name: BlogPost

# The posts stay, because notes, comments and tags still point at them; what
# identifies the author is rewritten when the author is erased.
erasure: anonymise

fields:
  - name: title
    type: string
    personal: true
  - name: slug
    type: slug
    source: title
  - name: summary
    type: string
    optional: true
    translatable: true
    personal: true
  - name: body
    type: richtext
    optional: true
    maxLength: 20000
  - name: privateNote
    type: encrypted
    optional: true
    personal: true

permissions:
  view: own
  create: own
  update: own
  delete: own

sorts:
  - createdAt
  - summary

filters:
  - title
  - slug
  - summary

includes:
  - relation: notes
    resource: BlogPostNote
    type: hasMany
    foreignKey: blogPostId
    ownRoute: true
  - relation: comments
    resource: Comment
    type: morphMany

aggregates:
  - relation: notes
    resource: BlogPostNote
    type: hasMany
    foreignKey: blogPostId
  - relation: comments
    resource: Comment
    type: morphMany

relations:
  - relation: tags
    resource: Tag
    pivotTable: BlogPostTag
    foreignKey: blogPostId
    relatedKey: tagId

pagination:
  limits: [10, 15, 20]
  default: 15
