name: BlogPost

fields:
  - name: title
    type: string
  - name: summary
    type: string
    optional: true
    translatable: true

permissions:
  view: own
  create: own
  update: own
  delete: own

sorts:
  - createdAt
  - summary

filters:
  - title
  - summary

includes:
  - relation: notes
    resource: BlogPostNote
    type: hasMany
    foreignKey: blogPostId
    ownRoute: true
  - relation: comments
    resource: Comment
    type: morphMany

aggregates:
  - relation: notes
    resource: BlogPostNote
    type: hasMany
    foreignKey: blogPostId
  - relation: comments
    resource: Comment
    type: morphMany

relations:
  - relation: tags
    resource: Tag
    pivotTable: BlogPostTag
    foreignKey: blogPostId
    relatedKey: tagId

pagination:
  limits: [10, 15, 20]
  default: 15
