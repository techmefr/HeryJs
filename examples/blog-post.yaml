name: BlogPost

fields:
  - name: title
    type: string

permissions:
  view: own
  create: own
  update: own
  delete: own

sorts:
  - createdAt

filters:
  - title

includes:
  - relation: notes
    resource: BlogPostNote
    type: hasMany
    foreignKey: blogPostId
  - relation: comments
    resource: Comment
    type: morphMany
    foreignKey: commentableId
    discriminator: commentableType
    discriminatorValue: BlogPost

aggregates:
  - relation: notes
    resource: BlogPostNote
    type: hasMany
    foreignKey: blogPostId
  - relation: comments
    resource: Comment
    type: morphMany
    foreignKey: commentableId
    discriminator: commentableType
    discriminatorValue: BlogPost

relations:
  - relation: tags
    resource: Tag
    pivotTable: BlogPostTag
    foreignKey: blogPostId
    relatedKey: tagId

pagination:
  limits: [10, 15, 20]
  default: 15
