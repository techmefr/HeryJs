name: Snippet
versioned: true
sharing: true

# Nothing else points at a snippet, so erasing its author removes the rows.
erasure: delete

fields:
  - name: title
    type: string

permissions:
  view: own
  create: own
  update: own
  delete: own

sorts:
  - createdAt

filters:
  - title

pagination:
  limits: [10, 20]
  default: 10
