name: Workout

fields:
  - name: title
    type: string

permissions:
  view: own
  create: own
  update: own
  delete: own

sorts:
  - createdAt

filters:
  - title

includes:
  - relation: notes
    resource: WorkoutNote
    type: hasMany
    foreignKey: workoutId
  - relation: comments
    resource: Comment
    type: morphMany
    foreignKey: commentableId
    discriminator: commentableType
    discriminatorValue: Workout

aggregates:
  - relation: notes
    resource: WorkoutNote
    type: hasMany
    foreignKey: workoutId
  - relation: comments
    resource: Comment
    type: morphMany
    foreignKey: commentableId
    discriminator: commentableType
    discriminatorValue: Workout

pagination:
  limits: [10, 15, 20]
  default: 15
